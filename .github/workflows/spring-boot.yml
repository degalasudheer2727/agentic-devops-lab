name: Spring Boot Delivery

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verify:
    name: Verify Spring Boot service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.package.outputs.digest }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: spring-boot-sample/pom.xml
      - name: Test and build executable JAR
        run: mvn -B -ntp -f spring-boot-sample/pom.xml clean verify
      - name: Smoke-test packaged service
        run: python3 spring-boot-sample/smoke.py spring-boot-sample/target/orders.jar
      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp -f spring-boot-sample/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Record digest and artifact name
        id: package
        run: |
          checksum=$(sha256sum < spring-boot-sample/target/orders.jar)
          echo "digest=${checksum%% *}" >> "$GITHUB_OUTPUT"
          echo "artifact=orders-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload release artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            spring-boot-sample/target/orders.jar
            spring-boot-sample/target/bom.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spring-test-results-${{ github.run_attempt }}
          path: |
            spring-boot-sample/target/surefire-reports/
            spring-boot-sample/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  staging:
    name: Promote Spring Boot JAR to staging sandbox
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: staging
    concurrency:
      group: spring-orders-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: dist
      - name: Verify and promote the same JAR
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.digest }}
        run: |
          bash spring-boot-sample/promote.sh dist/orders.jar "$EXPECTED_SHA256" "$RUNNER_TEMP/orders-staging"
          echo "Promoted orders.jar from $GITHUB_SHA with SHA-256 $EXPECTED_SHA256" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish verified release and container
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: dist
      - name: Reject a previously published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
      - name: Check and record release files
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.digest }}
        run: |
          cd dist
          printf '%s  orders.jar\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          sha256sum orders.jar bom.json > SHA256SUMS
      - name: Attest JAR provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/orders.jar
      - name: Build and smoke-test the container
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/orders"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f spring-boot-sample/Dockerfile -t "$image:$GITHUB_REF_NAME" dist
          id=$(docker run --detach --publish 127.0.0.1::8080 "$image:$GITHUB_REF_NAME")
          trap 'docker logs "$id"; docker rm -f "$id"' EXIT
          address=$(docker port "$id" 8080/tcp)
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-max-time 45 --max-time 5 "http://$address/actuator/health"
          python3 spring-boot-sample/smoke.py --url "http://$address"
      - name: Publish versioned container to GHCR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          digest_ref=$(docker image inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$digest_ref" > dist/container-image.txt
          echo "digest=${digest_ref##*@}" >> "$GITHUB_OUTPUT"
      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/orders.jar dist/bom.json dist/SHA256SUMS dist/container-image.txt
