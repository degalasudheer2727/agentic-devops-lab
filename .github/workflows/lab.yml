name: Agentic DevOps Lab
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Demo scenario
        type: choice
        options: [healthy, regression]
        default: healthy

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run baseline CI
        if: github.ref != 'refs/heads/main'
        run: python lab.py healthy --output lab-results
      - name: Run selected demo
        if: github.ref == 'refs/heads/main'
        env:
          SCENARIO: ${{ inputs.scenario }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: python lab.py "$SCENARIO" --output lab-results
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-evidence
          path: lab-results/
          retention-days: 7
