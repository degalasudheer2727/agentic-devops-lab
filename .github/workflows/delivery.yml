name: Delivery
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    name: Validate and package
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact_name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          python -m compileall -q shipping.py lab.py test_shipping.py
          python -m unittest -v
      - name: Verify bounded repair behavior
        run: |
          status=0
          python lab.py regression --output lab-results || status=$?
          test "$status" = 1
          python -c 'import json; assert json.load(open("lab-results/audit.json"))["learn"]["outcome"] == "verified_pending_review"'
          git apply --reverse --check lab-results/candidate.patch
      - name: Build release candidate
        id: package
        run: |
          bash scripts/build.sh dist/shipping.pyz
          test "$(python dist/shipping.pyz 5000)" = 0
          checksum=$(sha256sum < dist/shipping.pyz)
          echo "sha256=${checksum%% *}" >> "$GITHUB_OUTPUT"
          echo "name=shipping-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/shipping.pyz
          if-no-files-found: error
          retention-days: 14

  staging:
    name: Promote to staging sandbox
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
    environment: staging
    concurrency:
      group: shipping-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: dist
      - name: Verify digest and smoke test before promotion
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          bash scripts/promote.sh dist/shipping.pyz "$EXPECTED_SHA256" "$RUNNER_TEMP/staging"
          echo "Staged $EXPECTED_SHA256 from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
