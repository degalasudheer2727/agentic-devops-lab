name: Agentic DevOps Lab
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Demo scenario
        type: choice
        options: [healthy, regression]
        default: healthy

permissions: {}

jobs:
  lab:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Run baseline CI
        if: github.ref != 'refs/heads/main'
        run: python lab.py healthy --output lab-results
      - name: Run selected demo
        if: github.ref == 'refs/heads/main'
        env:
          SCENARIO: ${{ inputs.scenario }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: python lab.py "$SCENARIO" --output lab-results
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lab-evidence
          path: lab-results/
          retention-days: 7
