name: Agentic DevOps Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Demo scenario
        type: choice
        options: [healthy, regression]
        default: healthy

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run baseline CI
        if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
        run: python lab.py healthy --output lab-results
      - name: Run selected demo
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SCENARIO: ${{ inputs.scenario }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: python lab.py "$SCENARIO" --output lab-results
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-evidence
          path: lab-results/
          retention-days: 7
