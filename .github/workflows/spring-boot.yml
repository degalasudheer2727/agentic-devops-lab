name: Orders Service — Build, Scan, Stage, and Release

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '53 4 * * 2'
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  source-security:
    name: source-security / Scan secrets and container configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified scanners
        run: |
          bash tools/ci/install-scanner.sh gitleaks "$RUNNER_TEMP/scanners"
          bash tools/ci/install-scanner.sh trivy "$RUNNER_TEMP/scanners"
      - name: Scan checked-out Git history for secrets
        run: '"$RUNNER_TEMP/scanners/gitleaks" git --redact --no-banner --log-opts=HEAD .'
      - name: Gate high and critical Dockerfile misconfigurations
        run: |
          "$RUNNER_TEMP/scanners/trivy" config --exit-code 1 --severity HIGH,CRITICAL services/orders

  verify:
    name: Verify Spring Boot service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.package.outputs.digest }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/orders/pom.xml
      - name: Test and build executable JAR
        run: mvn -B -ntp -f services/orders/pom.xml clean verify
      - name: Smoke-test packaged service
        run: python3 services/orders/smoke.py services/orders/target/orders.jar
      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp -f services/orders/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Record digest and artifact name
        id: package
        run: |
          checksum=$(sha256sum < services/orders/target/orders.jar)
          echo "digest=${checksum%% *}" >> "$GITHUB_OUTPUT"
          echo "artifact=orders-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            services/orders/target/orders.jar
            services/orders/target/bom.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spring-test-results-${{ github.run_attempt }}
          path: |
            services/orders/target/surefire-reports/
            services/orders/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Scan and test the orders image
    needs: [verify, source-security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.archive.outputs.artifact }}
      digest: ${{ steps.archive.outputs.digest }}
      image_id: ${{ steps.archive.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: dist
      - name: Verify JAR and build image once
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.digest }}
        run: |
          printf '%s  dist/orders.jar\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f services/orders/Dockerfile -t "orders-candidate:$GITHUB_SHA" dist
      - name: Scan OS and application packages
        run: |
          bash tools/ci/install-scanner.sh trivy "$RUNNER_TEMP/scanners"
          "$RUNNER_TEMP/scanners/trivy" image --scanners vuln --timeout 12m \
            --format json --output "$RUNNER_TEMP/image-security.json" "orders-candidate:$GITHUB_SHA"
      - name: Retain full vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-security.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Block fixable high and critical image findings
        run: |
          report="$RUNNER_TEMP/image-security.json"
          count=$(jq -er '[.Results[]?.Vulnerabilities[]? | select(
            (.Severity == "HIGH" or .Severity == "CRITICAL") and
            ((.FixedVersion // "") != ""))] | length' "$report")
          echo "Fixable high or critical container findings: $count" >> "$GITHUB_STEP_SUMMARY"
          test "$count" -eq 0
      - name: Test HTTP security and run passive DAST against the image
        run: bash tools/ci/smoke-container.sh "orders-candidate:$GITHUB_SHA" "$RUNNER_TEMP/zap"
      - name: Retain passive DAST report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: passive-dast-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zap/zap.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Archive tested image
        if: github.event_name == 'push'
        id: archive
        run: |
          mkdir -p image-evidence
          docker save -o image-evidence/orders-image.tar "orders-candidate:$GITHUB_SHA"
          checksum=$(sha256sum < image-evidence/orders-image.tar)
          image_id=$(docker inspect --type image --format '{{.Id}}' "orders-candidate:$GITHUB_SHA")
          {
            echo "digest=${checksum%% *}"
            echo "artifact=orders-image-$GITHUB_RUN_ATTEMPT"
            echo "image_id=$image_id"
          } >> "$GITHUB_OUTPUT"
      - name: Upload tested image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.archive.outputs.artifact }}
          path: image-evidence/orders-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  candidate-gate:
    name: Require passing build and security checks
    needs: [verify, source-security, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify candidate checks completed successfully
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          SOURCE_RESULT: ${{ needs.source-security.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          printf 'Build: %s\nSource security: %s\nImage security: %s\n' \
            "$BUILD_RESULT" "$SOURCE_RESULT" "$IMAGE_RESULT"
          [[ $BUILD_RESULT == success && $SOURCE_RESULT == success && $IMAGE_RESULT == success ]]

  staging:
    name: Deploy tested image to staging sandbox
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: [image, candidate-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: staging
    outputs:
      receipt: ${{ steps.receipt.outputs.artifact }}
    concurrency:
      group: spring-orders-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.image.outputs.artifact }}
          path: staging-image
      - name: Verify image archive and deploy
        env:
          EXPECTED_SHA256: ${{ needs.image.outputs.digest }}
          EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
        run: |
          printf '%s  staging-image/orders-image.tar\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          docker load -i staging-image/orders-image.tar
          loaded_id=$(docker inspect --type image --format '{{.Id}}' "orders-candidate:$GITHUB_SHA")
          test "$loaded_id" = "$EXPECTED_IMAGE_ID"
          bash tools/ci/smoke-container.sh "orders-candidate:$GITHUB_SHA"
      - name: Record candidate identity and staging acceptance
        id: receipt
        env:
          ARCHIVE_SHA: ${{ needs.image.outputs.digest }}
          IMAGE_ID: ${{ needs.image.outputs.image_id }}
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg archive "$ARCHIVE_SHA" --arg image "$IMAGE_ID" \
            '{commit:$commit,run_id:$run,archive_sha256:$archive,image_id:$image,staging_smoke:"passed"}' \
            > staging-receipt.json
          echo "artifact=orders-staging-receipt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Staging accepted image \`$IMAGE_ID\` from commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload staging receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: staging-receipt.json
          if-no-files-found: error
          retention-days: 30

  registry:
    name: Publish and attest the staged container
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, image, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      bundle: ${{ steps.bundle.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: dist
      - name: Reject a previously published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.staging.outputs.receipt }}
          path: dist
      - name: Validate staging acceptance for the exact image
        env:
          EXPECTED_SHA256: ${{ needs.image.outputs.digest }}
          EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
        run: |
          jq -e --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg archive "$EXPECTED_SHA256" --arg image "$EXPECTED_IMAGE_ID" \
            '. == {commit:$commit,run_id:$run,archive_sha256:$archive,image_id:$image,staging_smoke:"passed"}' \
            dist/staging-receipt.json
      - name: Verify JAR checksum
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.digest }}
        run: |
          cd dist
          printf '%s  orders.jar\n' "$EXPECTED_SHA256" | sha256sum --check --strict
      - name: Attest JAR provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/orders.jar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.image.outputs.artifact }}
          path: staged-image
      - name: Load the verified image without rebuilding
        id: image
        env:
          EXPECTED_SHA256: ${{ needs.image.outputs.digest }}
        run: |
          printf '%s  staged-image/orders-image.tar\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          docker load -i staged-image/orders-image.tar
          image="ghcr.io/${GITHUB_REPOSITORY,,}/orders"
          docker tag "orders-candidate:$GITHUB_SHA" "$image:$GITHUB_REF_NAME"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Publish versioned container to GHCR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          digest_ref=$(docker image inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$digest_ref" > dist/container-image.txt
          echo "digest=${digest_ref##*@}" >> "$GITHUB_OUTPUT"
      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Seal release bundle
        id: bundle
        run: |
          (cd dist && sha256sum orders.jar bom.json container-image.txt staging-receipt.json > SHA256SUMS)
          echo "artifact=orders-release-bundle-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload release bundle for independent verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  registry-verify:
    name: Verify registry digest and release attestations
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.registry.outputs.bundle }}
          path: dist
      - name: Verify staged files, signed provenance, and pullable image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS
          image=$(cat container-image.txt)
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/orders"
          [[ "${image%@*}" == "$repository" && "${image##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          signer="$GITHUB_REPOSITORY/.github/workflows/spring-boot.yml"
          gh attestation verify orders.jar --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --source-digest "$GITHUB_SHA"
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --source-digest "$GITHUB_SHA"
          docker pull "$image"
          expected_id=$(jq -er .image_id staging-receipt.json)
          actual_id=$(docker inspect --type image --format '{{.Id}}' "$image")
          test "$actual_id" = "$expected_id"

  release:
    name: Publish verified GitHub Release
    needs: [registry, registry-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.registry.outputs.bundle }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            dist/orders.jar dist/bom.json dist/SHA256SUMS dist/container-image.txt dist/staging-receipt.json
